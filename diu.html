<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Diu 💗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap">
<style>
:root{--bg1:#ffe6ee;--bg2:#ffc9dc;--card:rgba(255,255,255,.8);--ink:#5a2a3d;--accent:#ff5d8f;--rim:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1422;--bg2:#4a1f38;--card:rgba(70,32,55,.8);--ink:#ffe3ec;--rim:#6b3453}}
:root[data-theme="dark"]{--bg1:#2b1422;--bg2:#4a1f38;--card:rgba(70,32,55,.8);--ink:#ffe3ec;--rim:#6b3453}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#ffe6ee;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 14px 28px;overflow-x:hidden;position:relative}
h1{font-family:"Pacifico",cursive;font-weight:400;font-size:2.1rem;margin:6px 0 0;text-align:center;color:var(--accent);text-shadow:0 2px 0 var(--rim)}
.sub{margin:4px 0 14px;opacity:.8;text-align:center}
.stage{position:relative;width:100%;max-width:480px;background:var(--card);border:4px solid var(--rim);border-radius:34px;box-shadow:0 12px 40px rgba(255,93,143,.28);overflow:hidden;z-index:2}
svg{display:block;width:100%;height:auto}
.msg{padding:12px 18px 18px;text-align:center;font-size:1.1rem;font-weight:600;min-height:72px;display:flex;align-items:center;justify-content:center}
.msg span{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(8px)}}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;width:100%;max-width:480px;z-index:2}
.b{border:0;background:var(--card);color:var(--ink);border:3px solid var(--rim);border-radius:22px;padding:10px 4px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:0 5px 0 rgba(255,93,143,.35);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:2px}
.b i{font-style:normal;font-size:1.9rem;line-height:1.1;transition:transform .2s}
.b:hover i{transform:scale(1.2) rotate(-8deg)}
.b:active{transform:translateY(4px);box-shadow:none}
.foot{margin-top:18px;opacity:.7;font-size:.9rem;z-index:2}
.p{position:absolute;pointer-events:none;z-index:6;animation:fly 2.6s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.3)}}
.rain{position:absolute;top:-30px;pointer-events:none;z-index:6;animation:fall 3.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),420px) rotate(var(--r));opacity:.9}}
.fl{position:fixed;top:105vh;pointer-events:none;z-index:1;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-120vh) rotate(var(--r))}}
.ch{transition:transform 1.1s cubic-bezier(.45,1.35,.5,1)}
.arm{transition:transform .9s cubic-bezier(.4,1.5,.5,1);transform-origin:0 0}
.idle{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
.hug .idle{animation:squish 1.1s ease-in-out 3 1s}
@keyframes squish{50%{transform:scale(1.07,.93)}}
.eo{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ea,.m2{display:none}
.happy .eo,.happy .m1{display:none}
.happy .ea,.happy .m2{display:inline}
.cheek{opacity:.35;transition:opacity .6s}
.blush .cheek{opacity:.9}
#it{opacity:0;transform:translate(214px,190px) scale(0);transition:transform 1s cubic-bezier(.34,1.56,.64,1),opacity .4s}
#it.on{opacity:1;transform:translate(214px,188px) scale(1.25)}
#it.give{transform:translate(236px,190px) scale(1.25)}
.give .lid{animation:lid .8s .3s forwards}
@keyframes lid{to{transform:translate(-26px,-22px) rotate(-35deg)}}
.steam{animation:steam 2s ease-in-out infinite;transform-box:fill-box}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.stars circle{animation:tw 3s ease-in-out infinite}

.msg{min-height:104px}
.ctl{margin-top:18px;z-index:2}
.next{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:1.15rem;padding:14px 30px;border-radius:40px;cursor:pointer;box-shadow:0 6px 0 rgba(180,40,90,.35);transition:transform .12s,opacity .3s}
.next:active{transform:translateY(4px);box-shadow:none}
.next:disabled{opacity:.45;cursor:default}
.chap{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:4px}
.tray{display:flex;gap:8px;margin-top:14px;font-size:1.6rem;z-index:2;background:var(--card);padding:6px 14px;border-radius:30px;border:3px solid var(--rim)}
.tray:empty{display:none}
.tray span{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.bar{position:absolute;top:0;left:0;right:0;height:6px;background:rgba(255,255,255,.4);z-index:7}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 6px 6px 0;transition:width .8s}
.wave{animation:wave .7s ease-in-out infinite!important}
@keyframes wave{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-180deg)}}
#bh{opacity:0;transform:translate(200px,62px) scale(0);transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.fin #bh{opacity:1;transform:translate(200px,62px) scale(1.3);animation:hb 1s ease-in-out 1s infinite}
@keyframes hb{50%{transform:translate(200px,62px) scale(1.5)}}
</style>
</head>
<body>
<h1>For Diu 💗</h1>
<p class="sub">A little story, just for you. Tap next.</p>
<div class="stage" id="stage"><div class="bar"><i id="bi"></i></div>
<svg id="svg" viewBox="0 0 400 300" role="img" aria-label="Two cartoon people in a cozy room">
 <defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0ea"/><stop offset="1" stop-color="#ffc4d6"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f8f"/><stop offset="1" stop-color="#8a6fc9"/></linearGradient>
 </defs>
 <rect width="400" height="300" fill="url(#wall)"/>
 <path d="M0 255h400v45H0z" fill="#e8a3bb"/>
 <path d="M0 255h400" stroke="#fff" stroke-width="3" opacity=".6"/>
 <!-- window -->
 <g transform="translate(26,58)">
  <rect width="86" height="100" rx="14" fill="url(#sky)" stroke="#fff" stroke-width="6"/>
  <g class="stars" fill="#fff"><circle cx="20" cy="22" r="2"/><circle cx="62" cy="18" r="1.6" style="animation-delay:-1s"/><circle cx="48" cy="46" r="1.8" style="animation-delay:-2s"/><circle cx="16" cy="64" r="1.5" style="animation-delay:-.5s"/></g>
  <path d="M58 62a16 16 0 1 0 12 24 12 12 0 0 1-12-24z" fill="#fff6c9"/>
  <path d="M43 0v100M0 50h86" stroke="#fff" stroke-width="4"/>
 </g>
 <!-- shelf -->
 <rect x="285" y="86" width="90" height="7" rx="3" fill="#fff"/>
 <circle cx="305" cy="74" r="10" fill="#ff8fb3"/><rect x="299" y="76" width="12" height="10" rx="2" fill="#ff5d8f"/>
 <rect x="330" y="66" width="10" height="20" rx="2" fill="#7aa2ff"/><rect x="342" y="62" width="10" height="24" rx="2" fill="#ffd166"/>
 <!-- plant -->
 <g transform="translate(372,255)"><path d="M-16 0l4-28h24l4 28z" fill="#ff9a76"/><path d="M0-28c-14-18-20-34-8-44 8 10 10 26 8 44zM0-28c14-14 22-30 12-42-10 10-14 24-12 42z" fill="#5fbf7a"/></g>
 <!-- rug -->
 <ellipse cx="200" cy="268" rx="170" ry="22" fill="#ff8fb3" opacity=".55"/>
 <ellipse cx="200" cy="268" rx="130" ry="15" fill="none" stroke="#fff" stroke-width="3" opacity=".7" stroke-dasharray="6 8"/>
 <!-- lights -->
 <g id="lights"></g>
 <g id="chars"></g>
 <g id="it"></g>
 <g id="bh"><path d="M0 18C-34-8-30-38 0-22 30-38 34-8 0 18z" fill="#ff5d8f" stroke="#fff" stroke-width="3"/><text y="-2" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="13" font-weight="600" fill="#fff">Diu</text></g>
</svg>
<div class="msg" id="msgbox"></div>
</div>
<div class="ctl"><button class="next" id="next">Start</button></div>
<div class="tray" id="tray"></div>
<div class="foot">Made with 💗 just for Diu</div>
<script>
const $=id=>document.getElementById(id),stage=$('stage');
function ch(o){const g=o.girl,s=o.skin;
return `<g class="ch" id="${o.id}" style="transform:translate(${o.x}px,262px)"><g class="idle" style="animation-delay:${o.d}s">
<ellipse cy="2" rx="36" ry="7" fill="#000" opacity=".12"/>
${g?`<path d="M-37-112c-6-48 80-48 74 0 2 26-2 48-10 54h-54c-8-6-12-28-10-54z" fill="${o.hair}"/>`:''}
<rect x="-17" y="-38" width="13" height="36" rx="6" fill="${g?s:o.bt}"/><rect x="4" y="-38" width="13" height="36" rx="6" fill="${g?s:o.bt}"/>
<ellipse cx="-11" cy="-2" rx="12" ry="6" fill="${g?'#ff5d8f':'#fff'}"/><ellipse cx="11" cy="-2" rx="12" ry="6" fill="${g?'#ff5d8f':'#fff'}"/>
${g?`<path d="M-22-92h44l15 58h-74z" fill="${o.top}"/><path d="M-30-48q30 10 60 0" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/><circle cx="-6" cy="-70" r="3" fill="#fff"/><circle cx="8" cy="-60" r="3" fill="#fff"/>`:`<rect x="-25" y="-94" width="50" height="62" rx="18" fill="${o.top}"/><path d="M-13-52h26v14h-26z" fill="#000" opacity=".12"/><path d="M-8-94q8 10 16 0" stroke="#fff" stroke-width="3" fill="none"/>`}
<g transform="translate(-23,-82)"><g class="arm" id="${o.id}L"><line y2="34" stroke="${g?s:o.top}" stroke-width="${g?9:12}" stroke-linecap="round"/><circle cy="37" r="6.5" fill="${s}"/></g></g>
<g transform="translate(23,-82)"><g class="arm" id="${o.id}R"><line y2="34" stroke="${g?s:o.top}" stroke-width="${g?9:12}" stroke-linecap="round"/><circle cy="37" r="6.5" fill="${s}"/></g></g>
<circle cx="-32" cy="-116" r="6" fill="${s}"/><circle cx="32" cy="-116" r="6" fill="${s}"/>
<circle cy="-118" r="33" fill="${s}"/>
${g?`<path d="M-34-124c4-26 64-26 68 0-10-12-26-16-34-16s-24 4-34 16z" fill="${o.hair}"/><path d="M-4-141c10 2 24 8 30 24-12-10-20-14-30-24z" fill="${o.hair}"/><path d="M24-136c-6-8 4-14 8-6 6-6 14 2 6 8l-7 7z" fill="#ff5d8f"/>`:`<path d="M-35-120C-38-168 38-168 35-120C29-134 14-142 0-142C-14-142-29-134-35-120z" fill="${o.hair}"/><path d="M-14-146Q0-152 14-146" stroke="#fff" stroke-width="3" opacity=".25" fill="none" stroke-linecap="round"/>`}
<g class="eo"><ellipse cx="-12" cy="-116" rx="4.4" ry="6" fill="#2b1b1b"/><circle cx="-10.6" cy="-118.4" r="1.7" fill="#fff"/></g>
<g class="eo"><ellipse cx="12" cy="-116" rx="4.4" ry="6" fill="#2b1b1b"/><circle cx="13.4" cy="-118.4" r="1.7" fill="#fff"/></g>
<path class="ea" d="M-17-114q5-8 10 0M7-114q5-8 10 0" stroke="#2b1b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
${g?'':`<g fill="rgba(255,255,255,.28)" stroke="#2b1b1b" stroke-width="2.6" stroke-linecap="round"><rect x="-24" y="-127" width="21" height="19" rx="7"/><rect x="3" y="-127" width="21" height="19" rx="7"/><path d="M-3-119h6M-24-120l-9-2M24-120l9-2" fill="none"/></g><path d="M-20-122l5-3M7-122l5-3" stroke="#fff" stroke-width="2" opacity=".7" stroke-linecap="round"/>`}
<path d="M-18-127q6-4 11-1M7-128q6-3 11 1" stroke="${o.hair}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle class="cheek" cx="-21" cy="-104" r="6.5" fill="#ff6b94"/><circle class="cheek" cx="21" cy="-104" r="6.5" fill="#ff6b94"/>
<path class="m1" d="M-8-102q8 7 16 0" stroke="#2b1b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
<path class="m2" d="M-11-105q11 16 22 0z" fill="#c0392b"/>
</g></g>`}
$('chars').innerHTML=ch({id:'boy',x:100,girl:0,skin:'#ffd3b0',hair:'#2f2320',top:'#6c8cff',bt:'#3b4a78',d:0})+ch({id:'girl',x:300,girl:1,skin:'#ffd3b0',hair:'#4a2c26',top:'#ff8fb3',d:-1.4});
// fairy lights
(function(){let h='',c=['#ff5d8f','#ffd166','#7aa2ff','#7be0a8'];for(let i=0;i<10;i++){const x0=i*40,x1=x0+40,m=x0+20;h+=`<path d="M${x0} 6Q${m} 30 ${x1} 6" stroke="#fff" stroke-width="2" fill="none"/><circle class="tw" cx="${m}" cy="22" r="4.5" fill="${c[i%4]}" style="animation-delay:${-i*.3}s"/>`}$('lights').innerHTML=h})();
const boy=$('boy'),girl=$('girl'),it=$('it');
const f=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="10" fill="${c}"/><circle cx="${x}" cy="${y}" r="4" fill="#ffd54a"/>`;
const ITEMS={
flowers:`<path d="M0 30L-14-2M0 30L0-10M0 30L14-2" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>${f(-14,-8,'#ff5d8f')}${f(14,-8,'#c77dff')}${f(0,-18,'#ffb703')}${f(0,-4,'#ff8fab')}<path d="M-20 8L20 8 6 36h-12z" fill="#ffd1e1" stroke="#ff8fb3" stroke-width="2"/>`,
choc:`<rect x="-30" y="-4" width="60" height="34" rx="7" fill="#8d4b2f"/><circle cx="-15" cy="8" r="8" fill="#3b1d12"/><circle cx="3" cy="8" r="8" fill="#5a2c18"/><circle cx="19" cy="8" r="7" fill="#3b1d12"/><circle cx="-8" cy="22" r="7" fill="#5a2c18"/><circle cx="10" cy="22" r="7" fill="#3b1d12"/><circle cx="-17" cy="5" r="2" fill="#fff" opacity=".6"/><g class="lid"><rect x="-32" y="-18" width="64" height="15" rx="6" fill="#ff5d8f"/><path d="M-4-18v15M4-18v15" stroke="#fff" stroke-width="4"/></g>`,
tea:`<path d="M-18-10h36v26a13 13 0 0 1-13 13h-10a13 13 0 0 1-13-13z" fill="#fff" stroke="#ff8fb3" stroke-width="3"/><path d="M18 0q16 3 0 20" stroke="#ff8fb3" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cy="-9" rx="17" ry="4" fill="#e9a66b"/><path d="M-9 14q9 8 18 0" stroke="#ff5d8f" stroke-width="3" fill="none"/><g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"><path class="steam" d="M-8-14q-6-8 0-14" /><path class="steam" style="animation-delay:-.7s" d="M2-14q-6-8 0-16"/><path class="steam" style="animation-delay:-1.3s" d="M11-14q-6-8 0-12"/></g>`,
heat:`<g transform="rotate(-18)"><rect x="-19" y="-24" width="38" height="56" rx="17" fill="#ff9a76"/><rect x="-7" y="-33" width="14" height="11" rx="3" fill="#e4572e"/><path d="M-14-8h28M-14 4h28M-14 16h28" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M-3 24q3-4 6 0" stroke="#fff" stroke-width="2.5" fill="none"/></g><g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"><path class="steam" d="M-12-38q-6-8 0-14"/><path class="steam" style="animation-delay:-.8s" d="M2-40q-6-8 0-14"/></g>`,
teddy:`<ellipse cy="14" rx="17" ry="19" fill="#c98f5b"/><circle cx="-17" cy="8" r="6.5" fill="#c98f5b"/><circle cx="17" cy="8" r="6.5" fill="#c98f5b"/><circle cx="-10" cy="32" r="7" fill="#c98f5b"/><circle cx="10" cy="32" r="7" fill="#c98f5b"/><circle cx="-14" cy="-28" r="7" fill="#c98f5b"/><circle cx="14" cy="-28" r="7" fill="#c98f5b"/><circle cy="-14" r="18" fill="#c98f5b"/><ellipse cy="-8" rx="8" ry="6" fill="#f0cfa3"/><circle cx="-6" cy="-18" r="2.2" fill="#222"/><circle cx="6" cy="-18" r="2.2" fill="#222"/><ellipse cy="-11" rx="3" ry="2" fill="#5a3a2e"/><path d="M0 24c-11-8-6-15 0-9 6-6 11 1 0 9z" fill="#ff5d8f"/>`
};
const E={hug:['💗','🤍','💞','💖'],flowers:['🌸','🌷','🌹','🌼'],choc:['🍫','🍬','🍪','🍩'],tea:['✨','☕','💫'],heat:['🧡','✨','♨️'],teddy:['🧸','💕','⭐','✨']};
const arms={};['boyL','boyR','girlL','girlR'].forEach(k=>arms[k]=$(k));
const setArms=o=>{for(const k in arms)arms[k].style.transform=`rotate(${o[k]||0}deg)`};
function rst(){boy.style.transform='translate(100px,262px)';girl.style.transform='translate(300px,262px)';setArms({});arms.boyR.classList.remove('wave');stage.classList.remove('happy','blush','hug','fin');it.setAttribute('class','')}
const pos=()=>stage.getBoundingClientRect();
function burst(l,n){const r=pos();for(let i=0;i<n;i++){const s=document.createElement('span');s.className='p';s.textContent=l[i%l.length];s.style.cssText=`left:${r.width*(.3+Math.random()*.4)}px;top:${r.height*.5+Math.random()*30}px;font-size:${22+Math.random()*14}px;animation-delay:${i*.09}s`;s.style.setProperty('--dx',(Math.random()*180-90)+'px');s.style.setProperty('--dy',-(110+Math.random()*130)+'px');s.style.setProperty('--r',(Math.random()*80-40)+'deg');stage.appendChild(s);setTimeout(()=>s.remove(),3400)}}
function rain(l,n){const r=pos();for(let i=0;i<n;i++){const s=document.createElement('span');s.className='rain';s.textContent=l[i%l.length];s.style.cssText=`left:${Math.random()*r.width}px;font-size:${18+Math.random()*12}px;animation-delay:${Math.random()*1.2}s`;s.style.setProperty('--dx',(Math.random()*60-30)+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');stage.appendChild(s);setTimeout(()=>s.remove(),5000)}}
// drifting background hearts
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fl';s.textContent=['💗','🌸','✨','💕'][i%4];s.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*16}px;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');document.body.appendChild(s)}
let t1,cur=0;
function hug(fin){stage.classList.add('hug');if(fin)stage.classList.add('fin');boy.style.transform='translate(178px,262px)';girl.style.transform='translate(222px,262px)';setArms({boyL:-70,boyR:-85,girlL:85,girlR:70});burst(E.hug,10);rain(E.hug,fin?26:14)}
function gift(k){boy.style.transform='translate(146px,262px)';setArms({boyL:-60,boyR:-88});it.innerHTML=ITEMS[k];it.classList.add('on');
 t1=setTimeout(()=>{it.classList.add('give');setArms({boyL:-30,boyR:-88,girlL:78,girlR:78});burst(E[k],12);if(k==='flowers')rain(E[k],18)},1100)}
const S=[
{c:"Hey Diu",m:"Diu, I know your periods are here, and I want to shower you with as much love as I can. Ready? 💗",b:"Okay, I'm ready 💗",f:()=>{arms.boyR.classList.add('wave')}},
{c:"Chapter 1 · A hug",m:"First things first. Come here. A big, warm, no-rush hug. 🤗",b:"And then… →",f:()=>hug(0),g:'🤗'},
{c:"Chapter 2 · For the cramps",m:"One warm pack, straight onto the tummy. Better? 🧡",b:"Now something to sip →",f:()=>gift('heat'),g:'🧡'},
{c:"Chapter 3 · Something warm",m:"Warm tea, made just right. Sip slowly, there's no hurry. ☕",b:"Something sweet →",f:()=>gift('tea'),g:'☕'},
{c:"Chapter 4 · Something sweet",m:"Chocolate is officially unlimited today. Doctor's orders (I'm the doctor). 🍫",b:"One more thing →",f:()=>gift('choc'),g:'🍫'},
{c:"Chapter 5 · Pretty things",m:"Because you deserve pretty things, especially on hard days. 💐",b:"Almost done →",f:()=>gift('flowers'),g:'💐'},
{c:"Chapter 6 · For tonight",m:"And for when I can't be next to you: a cuddle buddy. Very soft, very loyal. 🧸",b:"The last one 💗",f:()=>gift('teddy'),g:'🧸'},
{c:"The end (but not really)",m:"Rest now, Diu. Everything else can wait. I'm right here, loving you through every bit of it. 💗",b:"Replay ↺",f:()=>hug(1)}
